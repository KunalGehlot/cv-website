name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The build renders the CV PDFs from the site's data with Tectonic (site/scripts/render-cv.mjs).
      - name: Install Tectonic
        env:
          VERSION: 0.17.0
          SHA256: 8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7
        run: |
          curl -fsSL -o tectonic.tar.gz "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${VERSION}/tectonic-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${SHA256}  tectonic.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf tectonic.tar.gz -C "$HOME/.local/bin"
          rm tectonic.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache the TeX packages Tectonic fetches
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-0.17.0-${{ hashFiles('site/cv/**') }}
          restore-keys: tectonic-0.17.0-

      - name: Install, build, and upload
        uses: withastro/action@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
